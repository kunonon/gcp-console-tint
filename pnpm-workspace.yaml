# pnpm settings (single-package repository; no `packages` entry needed).

# WebdriverIO downloads the selected driver at test startup; installation needs no driver scripts.
allowBuilds:
  edgedriver: false
  geckodriver: false

# Supply-chain cooldown: a version must have been published for at least a week (10080
# minutes) before pnpm resolves it, transitive dependencies included. Compromised releases
# are usually pulled within hours, so this keeps `pnpm add` / `pnpm update` and lockfile
# refreshes behind that window. pnpm also checks the versions already in pnpm-lock.yaml
# against this policy on every install (frozen or not), so a lockfile carrying a version
# younger than a week is rejected until it ages — or until the package is listed under
# minimumReleaseAgeExclude. pnpm 11's default is one day.
minimumReleaseAge: 10080
overrides:
  # React Aria, held below 1.22 (react-aria 3.53): HeroUI's react-aria and react-aria-components
  # peers, plus the react-stately they pin. In 1.22, popovers (and modals, which take the same
  # code path) can stay invisible for about 600 ms on touch-capable desktops
  # (adobe/react-spectrum#10798), and an overlay whose exit animation is cancelled never unmounts
  # (adobe/react-spectrum#10772; the fix in #10783 is unmerged). These overrides also replace
  # @heroui/react's peer ranges, so pnpm will not warn when a HeroUI update needs a newer React
  # Aria: check its peerDependencies when bumping HeroUI. Remove once a release fixing both
  # issues has passed the cooldown above.
  react-aria: 3.52.1
  react-aria-components: 1.21.1
  react-stately: 3.50.0
