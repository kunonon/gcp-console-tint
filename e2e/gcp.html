<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GCP Console mock</title>
    <style>
      body { margin: 0; color: #222; font: 14px Arial, sans-serif; }
      #ocb-platform-bar { display: flex; height: 48px; align-items: center; justify-content: space-between; padding: 0 16px; background: #eee; }
      .cfc-platform-bar-left, .cfc-platform-bar-right, .pcc-platform-bar-button { display: flex; gap: 8px; align-items: center; }
      #main-content { padding: 24px; }
      #unaffected-content { color: #202124; }
    </style>
  </head>
  <body>
    <header id="ocb-platform-bar">
      <div class="cfc-platform-bar-left"><span id="platform-left-text">Google Cloud</span></div>
      <div class="cfc-platform-bar-right"><span id="platform-right-text">Help</span></div>
      <div class="pcc-platform-bar-button"><button id="platform-button-text" type="button">Project selector</button></div>
    </header>
    <!-- Where pages in the console's newer shell draw the platform bar (see renderShellBar). -->
    <one-cloud-bar-widget><mica-widget><div class="full"></div></mica-widget></one-cloud-bar-widget>
    <main id="main-content">
      <p id="current-url"></p>
      <p id="unaffected-content">This content is outside the platform bar.</p>
      <button id="navigate-project" type="button">Navigate to beta</button>
      <button id="navigate-home" type="button">Navigate to alpha</button>
      <button id="replace-project" type="button">Replace with beta</button>
      <button id="navigate-missing" type="button">Navigate to an unknown project</button>
      <button id="render-shell-bar" type="button">Render the shell platform bar</button>
      <a id="navigate-outside" href="https://outside.example.test/">Outside origin</a>
    </main>
    <script>
      const showUrl = () => { document.querySelector('#current-url').textContent = location.pathname + location.search; };
      const changeProject = (id, replace = false) => {
        const method = replace ? 'replaceState' : 'pushState';
        history[method]({}, '', `/?project=${encodeURIComponent(id)}`);
        showUrl();
      };
      document.querySelector('#navigate-project').addEventListener('click', () => changeProject('beta'));
      document.querySelector('#navigate-home').addEventListener('click', () => changeProject('alpha'));
      document.querySelector('#replace-project').addEventListener('click', () => changeProject('beta', true));
      document.querySelector('#navigate-missing').addEventListener('click', () => changeProject('missing'));
      // Pages in the console's newer shell, such as Cloud Run's overview (the fixture draws the bar on
      // every /run/ path), leave #ocb-platform-bar empty and draw the bar in one-cloud-bar-widget: mica,
      // the console's widget loader, attaches an open shadow root to a detached container, fills it,
      // resets the container's own styles (all: initial, display: block) and only then inserts it. The
      // text in there has colors of its own, so inherited color does not reach it, and the root's own
      // text rule has more specific selectors than the extension's, as the console's rules do, so only
      // !important lets the copied rule win. Each render replaces the previous container, numbered in
      // data-render.
      let renders = 0;
      const renderShellBar = () => {
        const host = document.createElement('div');
        host.attachShadow({ mode: 'open' }).innerHTML = `
          <style>
            .cfc-platform-bar-container { display: flex; height: 48px; align-items: center; justify-content: space-between; padding: 0 16px; }
            .cfc-platform-bar-container .cfc-platform-bar-left *, .cfc-platform-bar-container .cfc-platform-bar-right *, .cfc-platform-bar-container .pcc-platform-bar-button * { color: #3c4043; }
          </style>
          <pcc-platform-bar><cfc-platform-bar><div class="cfc-platform-bar-container">
            <div class="cfc-platform-bar-left"><span id="shell-left-text">Google Cloud</span></div>
            <div class="cfc-platform-bar-right"><span id="shell-right-text">Help</span></div>
            <div class="pcc-platform-bar-button"><button id="shell-button-text" type="button">Project selector</button></div>
          </div></cfc-platform-bar></pcc-platform-bar>`;
        host.setAttribute('mica-container', '');
        host.style.all = 'initial';
        host.style.display = 'block';
        host.dataset.render = String(++renders);
        const legacy = document.querySelector('#ocb-platform-bar');
        legacy.replaceChildren();
        legacy.style.height = '0';
        document.querySelector('one-cloud-bar-widget mica-widget div').replaceChildren(host);
      };
      document.querySelector('#render-shell-bar').addEventListener('click', renderShellBar);
      if (location.pathname.startsWith('/run/')) renderShellBar();
      showUrl();
    </script>
  </body>
</html>
