name: Label PR

# pull_request, not pull_request_target: GitHub's default policy blocks
# pull_request_target in public repositories from 2026-11-02, and same-repo PRs
# get a writable token under pull_request too. Fork PRs don't (see the job
# condition), so they need their label applied by hand.
# reopened is included so a PR whose initial labeling failed (or that was closed
# before the run completed) gets re-labeled on reopen without needing a title edit.
# synchronize is included because pull_request runs are skipped while a PR has a
# merge conflict; the push that resolves the conflict then applies the label.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    # Dependabot PRs keep only Dependabot's own `dependencies` label — a type
    # label derived from its chore/build title would misfile the PR under
    # Maintenance in the release notes (categories match first-wins).
    # Fork PRs are skipped: their pull_request token is read-only, so the label
    # edits would fail.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Apply type label from the PR title prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, not inline ${{ }} interpolation in the script, so a
          # crafted PR title can't inject shell code.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Conventional-commit type = everything before the first ':', '(' or '!'.
          type="${PR_TITLE%%[:(!]*}"
          case "$type" in
            feat) label=enhancement ;;
            fix) label=bug ;;
            docs) label=documentation ;;
            ci|build) label=ci ;;
            chore|refactor|test|perf|style) label=maintenance ;;
            *) label='' ;;
          esac

          # Drop stale type labels first so an edited title re-categorizes cleanly.
          for known in enhancement bug documentation ci maintenance; do
            if [ "$known" != "$label" ]; then
              gh pr edit "$PR_URL" --remove-label "$known" 2> /dev/null || true
            fi
          done
          if [ -n "$label" ]; then
            gh pr edit "$PR_URL" --add-label "$label"
          fi
