name: Release PR

# workflow_dispatch: manual body refresh (e.g. after retro-labeling merged PRs)
# without waiting for the next develop push.
# workflow_run: a develop push that lands while Release is still running reads
# the tag list and the latest release before the new tag exists, so the PR it
# issues is stale (no bump warning, notes spanning the previous release). A
# release or tag created with GITHUB_TOKEN never triggers other workflows, so
# re-run on Release completion instead; that run checks out the default branch
# (develop), the same ref the push runs use.
on:
  push:
    branches: [develop]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

# contents: write — the generate-notes API is a Releases endpoint and 403s with read-only.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"

          # Issuance-time bump guard: the required check on the PR is what
          # enforces this; the title/body warning makes it visible without
          # opening the checks tab.
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            tag_exists=true
          fi

          # generate-notes ignores target_commitish when tag_name is an existing
          # tag, which would leave the notes empty (v<version>...v<version>) in
          # the bump-required state. Name the develop branch instead: the notes
          # then cover develop since the release and the compare link resolves.
          tag_name="v${version}"
          if [ "$tag_exists" = true ]; then
            tag_name=develop
          fi

          # Without previous_tag_name GitHub infers the previous release from the
          # target's history, but release tags point at main-only merge commits,
          # which are never ancestors of develop — inference fails and the notes
          # span the full history. Pin the range to the latest release explicitly
          # (skipped before the first release, when there is nothing to pin).
          notes_args=(-f tag_name="$tag_name" -f target_commitish=develop)
          if previous="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2> /dev/null)"; then
            notes_args+=(-f previous_tag_name="$previous")
          fi

          # On failure gh api prints the error response to stdout, so reset notes
          # instead of letting the error JSON leak into the PR body.
          if ! notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${notes_args[@]}" --jq .body)"; then
            notes=""
          fi

          body="$(printf '%s\n\n---\n\nMerging this PR tags `v%s` and publishes a GitHub Release with the extension zips attached.\nMerge with **Create a merge commit** (the only method allowed on `main`).\n' "$notes" "$version")"

          title="Release v${version}"
          if [ "$tag_exists" = true ]; then
            title="Release v${version} ⚠️ version bump required"
            body="$(printf '> [!WARNING]\n> `v%s` is already released. Merge a version bump PR into `develop` before merging this release PR.\n\n%s' "$version" "$body")"
          fi

          existing="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          # Right after a release develop usually has nothing main lacks, and
          # gh pr create fails without commits to propose — wait for the next
          # develop push instead.
          elif [ "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...develop" --jq .ahead_by)" != 0 ]; then
            gh pr create --base main --head develop --title "$title" --body "$body"
          else
            echo "develop has no commits main lacks; no release PR to open."
          fi
