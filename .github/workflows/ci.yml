name: CI

# No push trigger for develop: its commits are already validated by pull_request
# runs (feature PRs, and the release PR whose head IS develop). A develop push run
# would emit a second same-named check run on the release PR's head commit —
# doubling CI cost and flake exposure on the release gate.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check browser download dependencies
        run: |
          pnpm list extract-zip --depth Infinity --json --lockfile-only | node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const containsExtractZip = (value) => value !== null && typeof value === "object" &&
              (value.from === "extract-zip" || Object.hasOwn(value, "extract-zip") ||
                Object.values(value).some(containsExtractZip));
            assert.equal(containsExtractZip(JSON.parse(readFileSync(0, "utf8"))), false,
              "extract-zip was reintroduced; review the browser download override");
          '

      # The checks are independent of each other, so they run as one parallel group
      # (each member becomes a background step with an implicit wait at the end; if one
      # fails, the rest still finish and the job fails at the group boundary). The two
      # browser builds stay sequential inside a single member: they share wxt's build
      # pipeline, and 5s of build time isn't worth probing it for temp-dir races.
      - parallel:
          - name: Lint
            run: pnpm lint

          - name: Type check
            run: pnpm compile

          - name: Test
            run: pnpm test

          - name: Build (Chrome + Firefox)
            run: pnpm build && pnpm build:firefox

      - name: Browser extension end-to-end (Chrome + Firefox)
        id: e2e
        timeout-minutes: 30
        run: docker compose --profile e2e run --rm --build -e E2E_BROWSER=all e2e

      - name: Upload end-to-end diagnostics
        if: always() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: |
            .e2e-artifacts/*/*/screenshots/**
            .e2e-artifacts/*/*/startup/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
