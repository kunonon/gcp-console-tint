services:
  dev:
    image: node:24-bookworm-slim
    working_dir: /app
    stdin_open: true
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # The container's own node_modules, shadowing whatever the host has at ./node_modules.
      # pnpm installs native binaries (lightningcss, rolldown, Biome, TypeScript, oxide) for
      # one platform only and prunes the rest, so a directory shared between macOS and this
      # Linux container breaks for whichever side installed second.
      - node_modules:/app/node_modules
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

volumes:
  node_modules:
