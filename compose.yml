services:
  dev:
    image: node:24-bookworm-slim
    working_dir: /app
    stdin_open: true
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # The container's own node_modules, shadowing whatever the host has at ./node_modules.
      # pnpm installs native binaries (lightningcss, rolldown, Biome, TypeScript, oxide) for
      # one platform only and prunes the rest, so a directory shared between macOS and this
      # Linux container breaks for whichever side installed second.
      - node_modules:/app/node_modules
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

  e2e:
    profiles: [e2e]
    platform: linux/amd64
    build:
      context: ./e2e
      dockerfile: Dockerfile
    working_dir: /workspace
    init: true
    shm_size: 2gb
    command: sh -c "pnpm install --frozen-lockfile && pnpm build && pnpm zip:firefox && xvfb-run -s '-screen 0 1600x1200x24' -a pnpm test:e2e:run"
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/node_modules
      - e2e_wxt:/workspace/.wxt
      - e2e_output:/workspace/.output
      - ./.e2e-artifacts:/artifacts
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      E2E_ARTIFACT_DIR: /artifacts
      E2E_CONTAINER: "1"
      E2E_HEADLESS: "0"

volumes:
  node_modules:
  e2e_node_modules:
  e2e_wxt:
  e2e_output:
